# ServerCloud / TruckOS configuration (Alpine base)
# Sourced by /etc/profile.d and the servercloud init script.

export SC_HOME="${SC_HOME:-/opt/servercloud}"
export SC_DATA="${SC_DATA:-/var/lib/servercloud}"
export TOKENPFS_HOME="${TOKENPFS_HOME:-$SC_DATA}"
export TRUCK_ROOT="${TRUCK_ROOT:-$SC_DATA/truck}"
export PATH="$SC_HOME:$PATH"

# Ollama backend URL (empty = auto-detect local ollama)
export TOKENPFS_OLLAMA_URL="${TOKENPFS_OLLAMA_URL:-}"
