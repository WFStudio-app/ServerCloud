name: Alpine Linux tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  alpine-container:
    name: Unit tests on Alpine ${{ matrix.alpine }}
    runs-on: ubuntu-latest
    container:
      image: alpine:${{ matrix.alpine }}
    strategy:
      fail-fast: false
      matrix:
        alpine: ["3.19", "3.20", "latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps via apk
        run: apk add --no-cache python3 py3-pip git curl bash
      - name: Install pytest
        run: pip install --break-system-packages pytest || pip install pytest
      - name: Run TruckOS test suite
        env:
          SC_DATA: /tmp/servercloud-data
          TOKENPFS_HOME: /tmp/servercloud-data
        run: python3 -m pytest tests/ -q

  alpine-docker-image:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-latest
    needs: alpine-container
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t servercloud:alpine -f docker/Dockerfile.alpine .
      - name: Smoke — unit tests inside the image
        run: docker run --rm -e SC_MODE=test servercloud:alpine
      - name: Smoke — API mode boots
        run: |
          docker run -d --name sc-api -e SC_MODE=api -p 8777:8777 servercloud:alpine
          sleep 5
          docker logs sc-api
          docker rm -f sc-api
